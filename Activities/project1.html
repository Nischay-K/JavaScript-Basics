<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Event Registration</h1> <br/>
   <form>
    <label for="username">Name : </label> <br/><br/>
    <input type="text" id = "username" name = "username" placeholder="Please enter your name"> <br/> <br/>
    <label for="useremail">Email : </label> <br/><br/>
    <input type="email" id = "useremail" name = "useremail" placeholder="Please enter your e-mail"> <br/> <br/>
    <label for="userphone">Phone : </label> <br/><br/>
    <input type="tel" id = "userphone" name = "userphone" placeholder="Please enter your phone number" width = 200px> <br/> <br/>
    <label for="occupation">Occupation :</label> <br/> <br/>
    <select name="occupation" id="occupation">
        <option value="Engineering">Engineering</option>
        <option value="doctor">Doctor</option>
        <option value="others">Others</option>
    </select> <br/> <br/>
    <label for="interest">Topics of Interest : </label> <br/> <br/>
    <input type="checkbox" name = "html" id = "interest1"> <br/>
    <label for="interest">HTML</label> <br/>
    <input type="checkbox" name = "css" id = "interest2"> <br/>
    <label for="interest2">CSS</label> <br/>
    <input type="checkbox" name = "javascript" id = "interest3"> <br/>
    <label for="interest3">JavaScript</label> <br/> <br/>
    <label for="comment1">Comments :                        </label> <br/> <br/>
    <textarea name="comment1" id="comment1" placeholder="Please comment here..."></textarea>
    <input type="submit" value = "Registration">
   </form> 
</body>
</html>
