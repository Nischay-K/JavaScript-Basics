<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Gilroy";
        }
        html,body {
            width: 100%;
            height: 100%;
        }
        input{
            display: block;
            margin-bottom: 20px;
            padding: 10px;
            width: 300px;
            border: none;
            border-radius: 5px;
        }
        #main {
            width: 100%;
            height: 100%;
            background-color: #222;
            padding: 30px;
        }
        .card{
            max-width: 300px;
            color: white;
            border: 1px solid #555;
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
            margin-top: 40px;
            font-family: "Gilroy";
            padding-left: 8px;
        }
        .profile{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card p{
            margin-top: 3px;
            font-size: 12px;
        }
        .card h5{
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id = "main">
        <form action="">
            <input type="text" placeholder = "profile pic"></input>
            <input type="text" placeholder = "Name"></input>
            <input type="text" placeholder = "Occupation"></input>
            <input type="text" placeholder = "Information"></input>
            <input type="submit" value="Submit"></input>
        </form>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
