<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-btn">Switch to Dark Theme</button>
    </div>

    <div class="stopwatch">
        <h1 id="display">00:00:00</h1>

        <div class="buttons">
            <img src="stop.png" onclick="watchStop()" alt="Stop">
            <img src="start.png" onclick="watchStart()" alt="Start">
            <img src="reset.png" onclick="watchReset()" alt="Reset">
            <img src="lap.png" onclick="recordLap()" alt="Lap">
        </div>

        <div class="laps">
            <h2>Laps</h2>
            <ul id="lap-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
